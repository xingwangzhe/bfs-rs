
[package]
authors = ["xingwangzhe"]
edition = "2021"
name = "bfs-rs"
version = "0.2.2"
description = "Rust BFS on compressed adjacency list with Rayon parallelism"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.13.0"
napi-derive = "3.6.9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
